<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">居室の換気に有効な開口部</text>

  <text x="250" y="62" text-anchor="middle" font-size="14" fill="#475569">居室の床面積を 20 等分すると…</text>

  <!-- 20分割バー -->
  <g>
    <rect x="50" y="80" width="400" height="60" fill="#cbd5e1"/>
    <g stroke="#fff" stroke-width="1.5">
      <line x1="70" y1="80" x2="70" y2="140"/><line x1="90" y1="80" x2="90" y2="140"/>
      <line x1="110" y1="80" x2="110" y2="140"/><line x1="130" y1="80" x2="130" y2="140"/>
      <line x1="150" y1="80" x2="150" y2="140"/><line x1="170" y1="80" x2="170" y2="140"/>
      <line x1="190" y1="80" x2="190" y2="140"/><line x1="210" y1="80" x2="210" y2="140"/>
      <line x1="230" y1="80" x2="230" y2="140"/><line x1="250" y1="80" x2="250" y2="140"/>
      <line x1="270" y1="80" x2="270" y2="140"/><line x1="290" y1="80" x2="290" y2="140"/>
      <line x1="310" y1="80" x2="310" y2="140"/><line x1="330" y1="80" x2="330" y2="140"/>
      <line x1="350" y1="80" x2="350" y2="140"/><line x1="370" y1="80" x2="370" y2="140"/>
      <line x1="390" y1="80" x2="390" y2="140"/><line x1="410" y1="80" x2="410" y2="140"/>
      <line x1="430" y1="80" x2="430" y2="140"/>
    </g>
    <!-- 1/20 = 換気開口 -->
    <rect x="430" y="80" width="20" height="60" fill="#38bdf8"/>
  </g>
  <text x="440" y="160" text-anchor="middle" font-size="13" fill="#0284c7" font-weight="700">1/20</text>

  <text x="250" y="210" text-anchor="middle" font-size="16" fill="#334155" font-weight="700">換気に有効な開口部 ≧ 床面積 × 1/20</text>
  <text x="250" y="248" text-anchor="middle" font-size="13" fill="#475569">※ 政令の基準に従い換気設備を設けた場合は除く</text>
  <text x="250" y="274" text-anchor="middle" font-size="12" fill="#94a3b8">（参考：採光に有効な開口部は別途必要 ＝ 住宅1/7 等）</text>
</svg>
