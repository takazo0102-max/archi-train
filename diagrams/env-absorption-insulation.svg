<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">吸音と遮音のしくみ</text>
  <rect x="15" y="34" width="470" height="92" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="34" width="470" height="16" fill="#dbeafe"/>
  <g font-size="10" fill="#334155">
    <text x="22" y="46" font-weight="700" fill="#1e3a8a">吸音（入射エネルギーのうち反射しなかった割合）</text>
    <text x="22" y="62">吸音率α＝（吸収＋透過）／入射 → 開放窓は α＝1・τ＝1 ／ 遮音は透過率で決まる</text>
    <text x="22" y="77">多孔質材（グラスウール）：厚くする → 低周波数域まで吸音率が高くなる</text>
    <text x="22" y="92">板振動型（ボード＋背後空気層）：低周波数域で吸音。空気層のGWは高域に効きにくい</text>
    <text x="22" y="107">孔あき板＋空気層（共鳴器）：空気層を厚く → 共鳴周波数は低域へ（厚さ2倍で 1/√2 倍）</text>
  </g>
  <rect x="15" y="134" width="470" height="108" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="134" width="470" height="16" fill="#fee2e2"/>
  <g font-size="10" fill="#334155">
    <text x="22" y="146" font-weight="700" fill="#991b1b">遮音</text>
    <text x="22" y="162">質量則：面密度または周波数が2倍 → 透過損失 ＋6dB ／ 垂直入射が最も高く斜め入射で低下</text>
    <text x="22" y="177">コインシデンス効果：特定周波数で遮音低下（合わせガラスは中間膜で緩和）</text>
    <text x="22" y="192">中空二重壁：空気層を厚く → 共鳴透過の周波数は「低く」なる ／ 乾式二重床は低域で共振に注意</text>
    <text x="22" y="207">Dr（空気音）：数値大ほど高性能 ／ Lr（床衝撃音）：数値小ほど高性能（Lr-40 ＞ Lr-55）</text>
    <text x="22" y="222">重量床衝撃音（飛び跳ね）は柔らかい仕上げでは改善しない → スラブ厚・剛性で対策</text>
  </g>
  <rect x="15" y="250" width="470" height="44" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="250" width="470" height="16" fill="#fef3c7"/>
  <g font-size="9.5" fill="#334155">
    <text x="22" y="262" font-weight="700" fill="#92400e">伝搬・聴覚</text>
    <text x="22" y="278">空気吸収・回折減衰は「高周波ほど大」（低音は回り込む）／ 可聴域 20Hz〜20kHz</text>
    <text x="22" y="292">マスキング：近い周波数・低い音が高い音をマスク ／ カクテルパーティー効果＝聞き分け</text>
  </g>
</svg>
