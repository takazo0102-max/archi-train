<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">主なタイル張り工法</text>
  <rect x="20" y="40" width="150" height="30" fill="#334155"/>
  <rect x="170" y="40" width="310" height="30" fill="#334155"/>
  <text x="35" y="60" font-size="13" fill="#fff" font-weight="700">工法</text>
  <text x="185" y="60" font-size="13" fill="#fff" font-weight="700">特徴（モルタル等の塗り方）</text>
  <g font-size="12" fill="#1e293b">
    <rect x="20" y="70" width="460" height="40" fill="#fff" stroke="#cbd5e1"/><text x="35" y="94" font-weight="700">密着張り</text><text x="185" y="88">下地に塗ったモルタルへ、振動工具</text><text x="185" y="104">（ヴィブラート）でタイルを埋め込む</text>
    <rect x="20" y="110" width="460" height="40" fill="#f8fafc" stroke="#cbd5e1"/><text x="35" y="134" font-weight="700">改良圧着張り</text><text x="185" y="128">下地面とタイル裏面の両方にモルタル</text><text x="185" y="144">を塗る（密着性が高い）</text>
    <rect x="20" y="150" width="460" height="40" fill="#fff" stroke="#cbd5e1"/><text x="35" y="174" font-weight="700">モザイク</text><text x="35" y="188" font-weight="700">タイル張り</text><text x="185" y="168">下地にモルタルを塗り、表張りユニットを</text><text x="185" y="184">たたき板でたたき押さえる</text>
    <rect x="20" y="190" width="460" height="40" fill="#f8fafc" stroke="#cbd5e1"/><text x="35" y="214" font-weight="700">マスク張り</text><text x="185" y="208">マスク板を当ててタイル裏面に均一に</text><text x="185" y="224">モルタルを塗り付けて張る</text>
    <rect x="20" y="230" width="460" height="40" fill="#fff" stroke="#cbd5e1"/><text x="35" y="254" font-weight="700">接着剤張り</text><text x="185" y="248">有機系接着剤を下地に塗る。主に内装</text><text x="185" y="264">の壁タイルに用いる（水を使わない）</text>
  </g>
  <text x="250" y="290" text-anchor="middle" font-size="11" fill="#475569">改良圧着＝下地＋タイル裏の両面、密着＝振動工具で埋め込み</text>
</svg>
