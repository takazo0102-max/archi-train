<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">かぶり厚さ・あき</text>
  <!-- コンクリート断面 -->
  <rect x="120" y="60" width="260" height="160" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- 帯筋 -->
  <rect x="150" y="90" width="200" height="100" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- 主筋（断面の丸） -->
  <g fill="#334155">
    <circle cx="165" cy="105" r="9"/><circle cx="250" cy="105" r="9"/><circle cx="335" cy="105" r="9"/>
    <circle cx="165" cy="175" r="9"/><circle cx="250" cy="175" r="9"/><circle cx="335" cy="175" r="9"/>
  </g>
  <!-- かぶり厚さ（最外側鉄筋→コンクリート表面） -->
  <g stroke="#dc2626" stroke-width="2" fill="#dc2626">
    <line x1="120" y1="240" x2="150" y2="240"/><polygon points="120,240 130,235 130,245"/><polygon points="150,240 140,235 140,245"/>
  </g>
  <text x="135" y="258" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">かぶり厚さ</text>
  <line x1="150" y1="90" x2="150" y2="245" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="120" y1="220" x2="120" y2="245" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- あき -->
  <g stroke="#2563eb" stroke-width="2" fill="#2563eb">
    <line x1="174" y1="105" x2="241" y2="105"/><polygon points="174,105 184,100 184,110"/><polygon points="241,105 231,100 231,110"/>
  </g>
  <text x="207" y="98" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">あき</text>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#334155" font-weight="700">かぶり＝最外側鉄筋表面〜コンクリート表面の最短距離（屋外は屋内より大）</text>
  <text x="250" y="296" text-anchor="middle" font-size="11" fill="#475569">あきは粗骨材最大寸法の1.25倍以上などが必要</text>
</svg>
