<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">高力ボルトの締付け順序</text>
  <!-- 継手板 -->
  <rect x="60" y="100" width="380" height="100" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <!-- ボルト（中央③→端部①） 配置: 端 ② ④ ② 端 ; numbering from center outward -->
  <g font-size="13" font-weight="700" fill="#fff">
    <circle cx="110" cy="135" r="16" fill="#64748b"/><text x="110" y="140" text-anchor="middle">5</text>
    <circle cx="190" cy="135" r="16" fill="#3b82f6"/><text x="190" y="140" text-anchor="middle">3</text>
    <circle cx="250" cy="135" r="16" fill="#dc2626"/><text x="250" y="140" text-anchor="middle">1</text>
    <circle cx="310" cy="135" r="16" fill="#3b82f6"/><text x="310" y="140" text-anchor="middle">3</text>
    <circle cx="390" cy="135" r="16" fill="#64748b"/><text x="390" y="140" text-anchor="middle">5</text>
    <circle cx="110" cy="170" r="16" fill="#64748b"/><text x="110" y="175" text-anchor="middle">6</text>
    <circle cx="190" cy="170" r="16" fill="#3b82f6"/><text x="190" y="175" text-anchor="middle">4</text>
    <circle cx="250" cy="170" r="16" fill="#dc2626"/><text x="250" y="175" text-anchor="middle">2</text>
    <circle cx="310" cy="170" r="16" fill="#3b82f6"/><text x="310" y="175" text-anchor="middle">4</text>
    <circle cx="390" cy="170" r="16" fill="#64748b"/><text x="390" y="175" text-anchor="middle">6</text>
  </g>
  <!-- 矢印 中央→端部 -->
  <g stroke="#dc2626" stroke-width="2.5" fill="#dc2626">
    <line x1="250" y1="225" x2="120" y2="225"/><polygon points="112,225 124,219 124,231"/>
    <line x1="250" y1="225" x2="380" y2="225"/><polygon points="388,225 376,219 376,231"/>
  </g>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">中央</text>
  <text x="250" y="262" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">本締めはボルト群の中央部から端部へ。一次締め→マーキング→本締め</text>
  <text x="250" y="282" text-anchor="middle" font-size="11" fill="#475569">摩擦面はミルスケール・油を除去し、すべり係数0.45以上を確保</text>
</svg>
