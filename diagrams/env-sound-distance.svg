<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">点音源と線音源の距離減衰</text>

  <!-- 点音源（球面拡散） -->
  <text x="135" y="58" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">点音源</text>
  <circle cx="70" cy="140" r="6" fill="#dc2626"/>
  <g fill="none" stroke="#60a5fa" stroke-width="2">
    <circle cx="70" cy="140" r="40"/><circle cx="70" cy="140" r="80"/><circle cx="70" cy="140" r="120"/>
  </g>
  <text x="135" y="225" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">距離2倍 → 約 −6dB</text>
  <text x="135" y="243" text-anchor="middle" font-size="11" fill="#475569">球面状に拡散</text>

  <line x1="250" y1="60" x2="250" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 線音源（円筒拡散） -->
  <text x="375" y="58" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">線音源</text>
  <line x1="375" y1="80" x2="375" y2="200" stroke="#dc2626" stroke-width="4"/>
  <g fill="none" stroke="#60a5fa" stroke-width="2">
    <rect x="335" y="80" width="80" height="120"/>
    <rect x="305" y="80" width="140" height="120"/>
    <rect x="280" y="80" width="190" height="120"/>
  </g>
  <text x="375" y="225" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">距離2倍 → 約 −3dB</text>
  <text x="375" y="243" text-anchor="middle" font-size="11" fill="#475569">円筒状に拡散</text>

  <text x="250" y="282" text-anchor="middle" font-size="12" fill="#334155">点音源の方が距離による減衰が大きい（6dB &gt; 3dB）</text>
</svg>
