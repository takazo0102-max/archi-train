<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">耐力壁の釣合いよい配置（四分割法）</text>
  <!-- 平面 -->
  <rect x="140" y="55" width="220" height="160" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <!-- 1/4 ゾーン -->
  <rect x="140" y="55" width="55" height="160" fill="#dbeafe" opacity="0.7"/>
  <rect x="305" y="55" width="55" height="160" fill="#dbeafe" opacity="0.7"/>
  <line x1="195" y1="55" x2="195" y2="215" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="305" y1="55" x2="305" y2="215" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 壁 -->
  <rect x="150" y="70" width="12" height="60" fill="#64748b"/>
  <rect x="150" y="150" width="12" height="50" fill="#64748b"/>
  <rect x="335" y="70" width="12" height="55" fill="#64748b"/>
  <rect x="320" y="150" width="12" height="50" fill="#64748b"/>
  <text x="167" y="245" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="700">両端 1/4</text>
  <text x="332" y="245" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="700">両端 1/4</text>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#94a3b8">中央 1/2</text>
  <text x="250" y="270" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="700">壁量が足りていても、両端1/4部分の壁の釣合い（壁率比）を確認する</text>
</svg>
