<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">レディーミクストコンクリートの受入検査</text>
  <g font-size="11" fill="#334155">
    <rect x="20" y="40" width="460" height="130" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="30" y="60" font-weight="700" fill="#1e293b">項目</text>
    <text x="260" y="60" font-weight="700" fill="#1e293b">判定基準</text>
    <line x1="20" y1="66" x2="480" y2="66" stroke="#94a3b8"/>
    <text x="30" y="84">スランプ（8cm以上18cm以下のとき）</text><text x="260" y="84" textLength="215" lengthAdjust="spacingAndGlyphs">指定値 <tspan font-weight="700">±2.5cm</tspan>（21cm：±1.5、5cm以下：±1）</text>
    <text x="30" y="102">スランプフロー（高流動）</text><text x="260" y="102">50cm：±7.5cm、60cm：±10cm</text>
    <text x="30" y="120">空気量（普通・軽量）</text><text x="260" y="120">4.5%（普通）／5.0%（軽量）<tspan font-weight="700">±1.5%</tspan></text>
    <text x="30" y="138">塩化物量（塩化物イオン）</text><text x="260" y="138"><tspan font-weight="700">0.30kg/m³以下</tspan>（承認あれば 0.60）</text>
    <text x="30" y="156">コンクリート温度</text><text x="260" y="156" textLength="215" lengthAdjust="spacingAndGlyphs">暑中 35℃以下（荷卸し時）／寒中 10〜20℃</text>
  </g>
  <g font-size="11" fill="#334155">
    <rect x="20" y="180" width="225" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="30" y="200" font-weight="700" fill="#1e293b">圧縮強度試験</text>
    <text x="30" y="218">● 1回の試験：3個の供試体の平均</text>
    <text x="30" y="234">● 150m³ごと（かつ打込み日ごと）に1回</text>
    <text x="30" y="250">● 1回 ≧ 0.85Fq かつ 3回平均 ≧ Fq</text>
    <text x="30" y="264" font-size="10" fill="#64748b">（構造体：標準養生28日 or 現場水中養生）</text>
  </g>
  <g font-size="11" fill="#334155">
    <rect x="255" y="180" width="225" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="265" y="200" font-weight="700" fill="#1e293b">運搬・打込み時間</text>
    <text x="265" y="218">● 練混ぜ→荷卸し：<tspan font-weight="700">1.5時間以内</tspan>（JIS）</text>
    <text x="265" y="234" textLength="210" lengthAdjust="spacingAndGlyphs">● 練混ぜ→打込み終了：外気25℃未満 <tspan font-weight="700">120分</tspan></text>
    <text x="265" y="250">　25℃以上 <tspan font-weight="700">90分</tspan></text>
    <text x="265" y="264" font-size="10" fill="#64748b">加水は禁止。スランプ低下時は流動化剤で調整</text>
  </g>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#64748b">試料は荷卸し地点で採取。単位水量 185kg/m³以下、水セメント比 65%以下（普通）</text>
</svg>
