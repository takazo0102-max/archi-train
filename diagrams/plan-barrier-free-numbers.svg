<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">バリアフリーの数値（手すり・出入口・便所）</text>
  <rect x="15" y="34" width="470" height="70" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="34" width="470" height="16" fill="#dbeafe"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="46" font-weight="700" fill="#1e3a8a">階段・手すり</text>
    <text x="22" y="62">手すり：上端で水平に45cm以上・下端は段鼻から45cm延長・踊場にも連続 ／ 二段手すり 650と850mm</text>
    <text x="22" y="77">蹴上げ15・踏面32・蹴込み1cm（蹴込み2cm以下）／ 段鼻と踏面は輝度対比を大きく（比1.0は×）</text>
    <text x="22" y="92">階段の有効幅：手すり10cmはないものとみなす（片側10cmまで）</text>
  </g>
  <rect x="15" y="112" width="470" height="86" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="112" width="470" height="16" fill="#fee2e2"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="124" font-weight="700" fill="#991b1b">出入口・水回り・便房</text>
    <text x="22" y="140">居室出入口 80cm以上（90は適）／ 浴室出入口 80cm以上 ／ 直角路で出入口に至る通路は 900mm以上</text>
    <text x="22" y="155">流し台・調理台の奥行 60cm ／ 浴槽の深さ 50cm・エプロン高さ 40cm</text>
    <text x="22" y="170">洗浄ボタンは紙巻器の直上、呼出しボタンは同じ高さで後方へ200mm（JIS S 0026）</text>
    <text x="22" y="185">オストメイト汚物流し：湯温調整付きレバーハンドル混合水栓 ／ 白内障には明度差の大きい表示（黒地に白）</text>
  </g>
  <rect x="15" y="206" width="470" height="56" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="206" width="470" height="16" fill="#fef3c7"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="218" font-weight="700" fill="#92400e">乳幼児・避難</text>
    <text x="22" y="234">おむつ交換台は男女便所にそれぞれ ／ 授乳室は男女がアクセスしやすい場所に施錠できる個室</text>
    <text x="22" y="249">立位でのおむつ交換・着脱衣用の着替え台を別に ／ 一時待避スペース（階段付室等）にはインターホン</text>
  </g>
  <text x="15" y="285" font-size="10" fill="#b91c1c" font-weight="700">ひっかけ：手すり延長30cmは不足（45）／直角路800mmは不足（900）／輝度比1.0は段差が見えない</text>
</svg>
