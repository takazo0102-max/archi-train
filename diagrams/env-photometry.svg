<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">測光量と単位</text>
  <!-- 光源 -->
  <circle cx="90" cy="120" r="22" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="160" text-anchor="middle" font-size="12" fill="#b45309" font-weight="700">光源</text>
  <!-- 光束（全方向） -->
  <g stroke="#f59e0b" stroke-width="1.5">
    <line x1="110" y1="108" x2="160" y2="80"/><line x1="112" y1="120" x2="170" y2="120"/><line x1="110" y1="132" x2="160" y2="160"/>
  </g>
  <text x="150" y="62" font-size="12" fill="#92400e">光束 [lm]＝光の総量</text>
  <!-- 光度（ある方向） -->
  <line x1="112" y1="120" x2="250" y2="120" stroke="#ea580c" stroke-width="3"/>
  <polygon points="250,120 240,115 240,125" fill="#ea580c"/>
  <text x="180" y="138" font-size="12" fill="#9a3412" font-weight="700">光度 [cd]＝方向の強さ</text>
  <!-- 受照面 照度 -->
  <rect x="300" y="95" width="14" height="80" fill="#cbd5e1" stroke="#94a3b8"/>
  <polygon points="255,118 300,108 300,128" fill="#fed7aa" opacity="0.8"/>
  <text x="322" y="120" font-size="12" fill="#334155" font-weight="700">照度 [lx]</text>
  <text x="322" y="136" font-size="11" fill="#475569">＝面が受ける光（lm/m²）</text>
  <!-- 輝度 -->
  <rect x="355" y="200" width="80" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="395" y="226" text-anchor="middle" font-size="12" fill="#334155" font-weight="700" textLength="74" lengthAdjust="spacingAndGlyphs">輝度 [cd/m²]</text>
  <text x="200" y="282" text-anchor="middle" font-size="12" fill="#475569">輝度＝面の見かけの明るさ。光度の単位は cd（lm ではない）</text>
</svg>
