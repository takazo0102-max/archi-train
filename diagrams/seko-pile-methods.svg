<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">場所打ちコンクリート杭の主な工法</text>
  <!-- アースドリル -->
  <g>
    <rect x="40" y="60" width="120" height="150" fill="#e7d8c4"/>
    <rect x="80" y="60" width="40" height="150" fill="#cfe0ee"/>
    <line x1="80" y1="60" x2="80" y2="210" stroke="#64748b" stroke-width="2"/><line x1="120" y1="60" x2="120" y2="210" stroke="#64748b" stroke-width="2"/>
    <text x="100" y="232" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">アースドリル</text>
    <text x="100" y="248" text-anchor="middle" font-size="10.5" fill="#475569">回転バケットで掘削</text>
    <text x="100" y="261" text-anchor="middle" font-size="10.5" fill="#0c5a82" font-weight="700">安定液で孔壁保護</text>
  </g>
  <!-- オールケーシング -->
  <g>
    <rect x="190" y="60" width="120" height="150" fill="#e7d8c4"/>
    <rect x="230" y="60" width="40" height="150" fill="#fff"/>
    <rect x="226" y="60" width="6" height="150" fill="#475569"/><rect x="268" y="60" width="6" height="150" fill="#475569"/>
    <text x="250" y="232" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">オールケーシング</text>
    <text x="250" y="248" text-anchor="middle" font-size="10.5" fill="#475569">ケーシングを揺動圧入</text>
    <text x="250" y="261" text-anchor="middle" font-size="10.5" fill="#7c3aed" font-weight="700">ケーシングで孔壁保護</text>
  </g>
  <!-- リバース -->
  <g>
    <rect x="340" y="60" width="120" height="150" fill="#e7d8c4"/>
    <rect x="380" y="60" width="40" height="150" fill="#cfe0ee"/>
    <line x1="380" y1="60" x2="380" y2="210" stroke="#64748b" stroke-width="2"/><line x1="420" y1="60" x2="420" y2="210" stroke="#64748b" stroke-width="2"/>
    <line x1="340" y1="95" x2="460" y2="95" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="340" y1="80" x2="460" y2="80" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="466" y="84" font-size="9" fill="#15803d" text-anchor="end">孔内水位</text>
    <text x="400" y="232" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">リバース</text>
    <text x="400" y="248" text-anchor="middle" font-size="10.5" fill="#475569">孔内水位を地下水位より</text>
    <text x="400" y="261" text-anchor="middle" font-size="10.5" fill="#0c5a82" font-weight="700">高く保ち静水圧で孔壁保護</text>
  </g>
  <text x="250" y="284" text-anchor="middle" font-size="11" fill="#334155">いずれも孔壁の崩壊を防ぎながら掘削し、鉄筋かごを建込みコンクリートを打設</text>
</svg>
