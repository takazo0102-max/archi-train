<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">ガラスのはめ込みとクリアランス</text>
  <!-- サッシ溝（断面） -->
  <path d="M120,70 L380,70 L380,230 L120,230 L120,180 L160,180 L160,120 L120,120 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <path d="M120,70 L120,120 L160,120 L160,180 L120,180 L120,230" fill="none"/>
  <rect x="120" y="120" width="40" height="60" fill="#94a3b8"/>
  <!-- ガラス -->
  <rect x="200" y="60" width="18" height="180" fill="#a5d8ef" stroke="#5a9fc4" stroke-width="1.5"/>
  <text x="209" y="50" text-anchor="middle" font-size="12" fill="#0c5a82" font-weight="700">ガラス</text>
  <!-- セッティングブロック -->
  <rect x="196" y="232" width="26" height="10" fill="#1e293b"/>
  <text x="240" y="248" font-size="10.5" fill="#334155">セッティングブロック（自重支持）</text>
  <!-- かかり代 -->
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a"><line x1="160" y1="100" x2="200" y2="100"/><polygon points="160,100 170,95 170,105"/><polygon points="200,100 190,95 190,105"/></g>
  <text x="180" y="92" text-anchor="middle" font-size="10" fill="#15803d" font-weight="700">かかり代</text>
  <!-- 面クリアランス -->
  <g stroke="#dc2626" stroke-width="2" fill="#dc2626"><line x1="160" y1="150" x2="200" y2="150"/></g>
  <text x="180" y="166" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">面クリア</text>
  <!-- エッジクリアランス -->
  <g stroke="#7c3aed" stroke-width="2" fill="#7c3aed"><line x1="209" y1="60" x2="209" y2="48"/></g>
  <text x="290" y="80" font-size="10.5" fill="#6d28d9" font-weight="700">エッジクリアランス（小口〜溝底）</text>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#334155" font-weight="700">かかり代・エッジクリアランス・面クリアランスを適切に確保する</text>
</svg>
