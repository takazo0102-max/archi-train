<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">給湯設備（中央式・循環配管）</text>
  <!-- 系統図 -->
  <rect x="30" y="60" width="70" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="65" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#7f1d1d">貯湯槽</text>
  <text x="65" y="114" text-anchor="middle" font-size="9" fill="#7f1d1d">60℃以上</text>
  <rect x="30" y="170" width="70" height="30" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="65" y="189" text-anchor="middle" font-size="9" fill="#334155">加熱装置</text>
  <line x1="100" y1="80" x2="220" y2="80" stroke="#ef4444" stroke-width="4"/>
  <text x="160" y="74" text-anchor="middle" font-size="9" fill="#b91c1c">給湯管（往）</text>
  <line x1="220" y1="80" x2="220" y2="140" stroke="#ef4444" stroke-width="4"/>
  <line x1="220" y1="140" x2="100" y2="140" stroke="#f59e0b" stroke-width="3"/>
  <text x="160" y="154" text-anchor="middle" font-size="9" fill="#b45309">返湯管（復）→ 循環ポンプ</text>
  <g stroke="#ef4444" stroke-width="2"><line x1="150" y1="80" x2="150" y2="100"/><line x1="190" y1="80" x2="190" y2="100"/></g>
  <text x="150" y="112" text-anchor="middle" font-size="8" fill="#334155">水栓</text><text x="190" y="112" text-anchor="middle" font-size="8" fill="#334155">水栓</text>
  <circle cx="120" cy="140" r="7" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="120" y="143" text-anchor="middle" font-size="7" fill="#b45309">P</text>
  <rect x="30" y="210" width="200" height="30" fill="#fff" stroke="#94a3b8"/>
  <text x="130" y="229" text-anchor="middle" font-size="9" fill="#334155">膨張管・膨張タンク（逆止弁を設けない）</text>
  <g font-size="10.5" fill="#334155">
    <rect x="245" y="42" width="240" height="200" fill="#fff" stroke="#94a3b8"/>
    <text x="365" y="60" text-anchor="middle" font-weight="700" fill="#1e293b">覚えること</text>
    <text x="253" y="80">● 貯湯温度 <tspan font-weight="700">60℃以上</tspan>、末端 55℃以上</text>
    <text x="253" y="96">　（レジオネラ対策）。使用は混合水栓で 40℃</text>
    <text x="253" y="114" textLength="227" lengthAdjust="spacingAndGlyphs">● 返湯管で循環させ、水栓を開けてすぐ湯が出る</text>
    <text x="253" y="130" textLength="227" lengthAdjust="spacingAndGlyphs">　（湯待ち時間の短縮）。循環ポンプは返湯管側</text>
    <text x="253" y="148">● 膨張管には弁を設けない（閉塞すると破裂）</text>
    <text x="253" y="164">● 給湯管は上向き配管で空気抜き、勾配 1/200</text>
    <text x="253" y="182">● 管材：銅管・ステンレス・耐熱塩ビ（HTVP）</text>
    <text x="253" y="198" textLength="227" lengthAdjust="spacingAndGlyphs">　銅管は流速 1.5m/s 以下（潰食・エロージョン）</text>
    <text x="253" y="216" textLength="227" lengthAdjust="spacingAndGlyphs">● 給湯量：ホテル 150〜250L/室、事務所 7〜10L/人</text>
    <text x="253" y="232" textLength="227" lengthAdjust="spacingAndGlyphs">● 局所式：瞬間式（号数）・貯湯式（電気温水器）</text>
  </g>
  <text x="250" y="266" text-anchor="middle" font-size="10.5" fill="#334155">中央式＝1か所で加熱し各所へ配管（大規模）／局所式＝使う場所ごとに給湯機（熱損失小）</text>
  <text x="250" y="286" text-anchor="middle" font-size="10" fill="#64748b">シャワー等の湯温制御：サーモスタット混合水栓。安全弁・逃し弁で膨張圧を逃がす</text>
</svg>
