<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">劇場・ホールの形式と客席の数字</text>
  <rect x="20" y="42" width="140" height="100" fill="#fff" stroke="#94a3b8"/>
  <rect x="30" y="50" width="120" height="28" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="30" y="78" width="120" height="5" fill="#1e293b"/>
  <rect x="40" y="90" width="100" height="44" fill="#dbeafe"/>
  <text x="90" y="69" text-anchor="middle" font-size="10" fill="#78350f">舞台</text>
  <text x="90" y="116" text-anchor="middle" font-size="10" fill="#1e3a8a">客席</text>
  <text x="90" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">プロセニアム型</text>
  <text x="90" y="170" text-anchor="middle" font-size="9" fill="#334155">額縁で分離・オペラ向き</text>
  <rect x="180" y="42" width="140" height="100" fill="#fff" stroke="#94a3b8"/>
  <circle cx="250" cy="92" r="20" fill="#fde68a" stroke="#f59e0b"/>
  <circle cx="250" cy="92" r="40" fill="none" stroke="#3b82f6" stroke-width="10" opacity="0.4"/>
  <text x="250" y="96" text-anchor="middle" font-size="10" fill="#78350f">舞台</text>
  <text x="250" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">アリーナ型</text>
  <text x="250" y="170" text-anchor="middle" font-size="9" fill="#334155">四方から囲む・背景なし</text>
  <rect x="340" y="42" width="140" height="100" fill="#fff" stroke="#94a3b8"/>
  <rect x="350" y="50" width="52" height="84" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="355" y="55" width="42" height="16" fill="#fde68a"/>
  <text x="376" y="110" text-anchor="middle" font-size="8" fill="#1e3a8a">靴箱型</text>
  <rect x="412" y="50" width="58" height="84" fill="none" stroke="#3b82f6"/>
  <rect x="430" y="82" width="22" height="22" fill="#fde68a"/>
  <g fill="#dbeafe"><rect x="416" y="54" width="50" height="22"/><rect x="416" y="110" width="50" height="20"/><rect x="416" y="80" width="10" height="26"/><rect x="456" y="80" width="10" height="26"/></g>
  <text x="441" y="97" text-anchor="middle" font-size="7" fill="#78350f">舞台</text>
  <text x="410" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">コンサートホール</text>
  <text x="410" y="170" text-anchor="middle" font-size="9" fill="#334155">靴箱型＝残響／ぶどう畑型＝近さ</text>
  <g font-size="10.5" fill="#334155">
    <rect x="20" y="180" width="460" height="96" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="30" y="198">● 客席 1人あたり <tspan font-weight="700">0.5〜0.7m²</tspan>　● 前後の座席間隔 <tspan font-weight="700">90〜100cm</tspan></text>
    <text x="30" y="216">● 視距離：演劇 <tspan font-weight="700">22m</tspan>（表情が分かる）／オペラ・ミュージカル <tspan font-weight="700">38m</tspan></text>
    <text x="30" y="234">● 横1列の席数：片側通路 8席、両側通路 16席まで</text>
    <text x="30" y="252">● 舞台の高さ 60〜100cm　● 俯角 30°以内・水平視角 60°以内</text>
    <text x="30" y="270">● プロセニアム幅：演劇 8〜12m／オペラ 16〜20m　● フライ高さ：開口の2.5倍</text>
  </g>
  <text x="250" y="292" text-anchor="middle" font-size="10" fill="#64748b">最適残響：講演 1.0s ＜ オペラ 1.3〜1.6s ＜ コンサート 1.8〜2.2s（500Hz・満席）</text>
</svg>
