<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">木表・木裏と板の反り</text>
  <!-- 丸太断面 -->
  <g>
    <circle cx="120" cy="140" r="75" fill="#e7c9a0" stroke="#b08d5a" stroke-width="2"/>
    <circle cx="120" cy="140" r="55" fill="none" stroke="#c8a878" stroke-width="1.5"/>
    <circle cx="120" cy="140" r="35" fill="none" stroke="#c8a878" stroke-width="1.5"/>
    <circle cx="120" cy="140" r="15" fill="none" stroke="#c8a878" stroke-width="1.5"/>
    <!-- 切り出す板 -->
    <rect x="120" y="95" width="78" height="20" fill="#d9b98a" stroke="#a07a45" stroke-width="1.5" opacity="0.9"/>
    <text x="40" y="80" font-size="11" fill="#7c5a2e">樹皮側＝木表</text>
    <text x="95" y="225" font-size="11" fill="#7c5a2e">中心（髄）側＝木裏</text>
  </g>
  <!-- 板の反り -->
  <g>
    <text x="370" y="80" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">乾燥すると…</text>
    <path d="M290,150 Q370,120 450,150" fill="none" stroke="#a07a45" stroke-width="10" stroke-linecap="round"/>
    <text x="370" y="118" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">木表（凹）</text>
    <text x="370" y="178" text-anchor="middle" font-size="11" fill="#475569">木裏（凸）</text>
  </g>
  <text x="250" y="245" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="700">接線方向の収縮 ＞ 半径方向の収縮 のため</text>
  <text x="250" y="266" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="700">板目板は木表側が凹む（木表側に反る）</text>
</svg>
