<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">鉄筋の定着・継手・フック</text>
  <!-- フック3種 -->
  <g stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M40,120 L120,120 L120,80"/>
    <path d="M170,120 L250,120 L250,95 L235,80"/>
    <path d="M300,120 L380,120 A12,12 0 0 0 380,96 L355,96"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#334155">
    <text x="80" y="145" font-weight="700" fill="#1e293b">90度フック</text><text x="80" y="161">余長 8d 以上</text>
    <text x="210" y="145" font-weight="700" fill="#1e293b">135度フック</text><text x="210" y="161">余長 6d 以上（帯筋）</text>
    <text x="340" y="145" font-weight="700" fill="#1e293b">180度フック</text><text x="340" y="161">余長 4d 以上</text>
  </g>
  <text x="250" y="60" text-anchor="middle" font-size="11" fill="#334155">フックの角度が変わっても「定着長さ」は同じ（余長のみ変わる）</text>
  <!-- 重ね継手 -->
  <g stroke="#1e293b" stroke-width="4" stroke-linecap="round">
    <line x1="40" y1="205" x2="220" y2="205"/>
    <line x1="150" y1="215" x2="330" y2="215"/>
  </g>
  <line x1="150" y1="228" x2="220" y2="228" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="244" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">重ね長さ L</text>
  <g font-size="11" fill="#334155">
    <text x="350" y="200" font-weight="700" fill="#1e293b">法令（令73条）</text>
    <text x="350" y="216">引張力の最小部：25d</text>
    <text x="350" y="232">その他：40d</text>
    <text x="350" y="248" textLength="145" lengthAdjust="spacingAndGlyphs">隣接継手は 0.5L以上 ずらす</text>
  </g>
  <text x="250" y="278" text-anchor="middle" font-size="11" fill="#334155" textLength="494" lengthAdjust="spacingAndGlyphs">定着長さはコンクリート強度が高いほど短い／太径・隅角部・上端筋は付着に不利（許容付着応力度は上端筋が小さい）</text>
</svg>
