<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">杭の支持機構</text>
  <!-- 支持杭 -->
  <g>
    <rect x="40" y="55" width="120" height="120" fill="#e7d8c4"/>
    <rect x="40" y="175" width="120" height="50" fill="#b7a07c"/>
    <rect x="92" y="55" width="16" height="120" fill="#94a3b8"/>
    <line x1="100" y1="175" x2="100" y2="190" stroke="#dc2626" stroke-width="3"/><polygon points="100,190 95,180 105,180" fill="#dc2626"/>
    <text x="100" y="242" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">支持杭</text>
    <text x="100" y="258" text-anchor="middle" font-size="10.5" fill="#475569">先端を支持層に到達</text>
    <text x="100" y="271" text-anchor="middle" font-size="10.5" fill="#b91c1c">先端支持力で支える</text>
  </g>
  <!-- 摩擦杭 -->
  <g>
    <rect x="190" y="55" width="120" height="170" fill="#e7d8c4"/>
    <rect x="242" y="55" width="16" height="160" fill="#94a3b8"/>
    <g stroke="#16a34a" stroke-width="2" fill="#16a34a">
      <line x1="262" y1="90" x2="278" y2="90"/><polygon points="262,90 270,85 270,95"/>
      <line x1="262" y1="130" x2="278" y2="130"/><polygon points="262,130 270,125 270,135"/>
      <line x1="262" y1="170" x2="278" y2="170"/><polygon points="262,170 270,165 270,175"/>
    </g>
    <text x="250" y="242" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">摩擦杭</text>
    <text x="250" y="258" text-anchor="middle" font-size="10.5" fill="#475569">支持層に届かない</text>
    <text x="250" y="271" text-anchor="middle" font-size="10.5" fill="#15803d">周面摩擦で支える</text>
  </g>
  <!-- 負の摩擦力 -->
  <g>
    <rect x="340" y="55" width="120" height="170" fill="#d9c6a8"/>
    <rect x="392" y="55" width="16" height="170" fill="#94a3b8"/>
    <g stroke="#dc2626" stroke-width="2" fill="#dc2626">
      <line x1="412" y1="80" x2="412" y2="100"/><polygon points="412,100 407,90 417,90" /></g>
    <g stroke="#dc2626" stroke-width="2" fill="#dc2626">
      <line x1="412" y1="120" x2="412" y2="140"/><polygon points="412,140 407,130 417,130"/></g>
    <text x="430" y="118" font-size="10" fill="#b91c1c" textLength="25" lengthAdjust="spacingAndGlyphs">沈下↓</text>
    <text x="400" y="242" text-anchor="middle" font-size="12.5" fill="#1e293b" font-weight="700">負の摩擦力</text>
    <text x="400" y="258" text-anchor="middle" font-size="10.5" fill="#475569">圧密沈下する地盤が</text>
    <text x="400" y="271" text-anchor="middle" font-size="10.5" fill="#b91c1c">杭を下向きに引く</text>
  </g>
</svg>
