<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">ガス圧接の外観検査ほか 施工の数値</text>
  <rect x="15" y="36" width="470" height="72" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="36" width="470" height="16" fill="#dbeafe"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="48" font-weight="700" fill="#1e3a8a">ガス圧接継手の外観検査</text>
    <text x="22" y="64">膨らみの直径 1.4d以上、膨らみの長さ 1.1d以上（不足は再加熱・加圧して修正）</text>
    <text x="22" y="80">偏心量 d/5以下（D22なら4.4mm）。超えたら 切り取って再圧接（再加熱では直せない）</text>
    <text x="22" y="96">検査技能者：当該工事の圧接施工・品質管理に関与していない 第三者</text>
  </g>
  <rect x="15" y="114" width="470" height="88" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="114" width="470" height="16" fill="#fef3c7"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="126" font-weight="700" fill="#92400e">土工事・地業</text>
    <text x="22" y="142">埋戻しのまき出し厚さ 30cm程度ごとに締固め（×50cm）</text>
    <text x="22" y="158">雨水ます・マンホールの泥だめ 深さ150mm以上（×100mm）</text>
    <text x="22" y="174">セメント系固化材の地盤改良：事前に 六価クロム溶出試験</text>
    <text x="22" y="190">バイブロフローテーション：振動体で砂質土を締め固め砂杭を造成</text>
  </g>
  <rect x="15" y="208" width="470" height="52" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="208" width="470" height="16" fill="#fee2e2"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="220" font-weight="700" fill="#991b1b">仕上り・取付け</text>
    <text x="22" y="236">コンクリートの平たんさ：仕上げ厚7mm未満→3mにつき7mm以下／7mm以上→1mにつき10mm以下</text>
    <text x="22" y="252">壁付け衛生器具：樹脂製プラグでコンクリート壁に取付け</text>
  </g>
  <text x="250" y="292" text-anchor="middle" font-size="9.5" fill="#64748b">1.4d・1.1d・d/5・30cm・150mm</text>
</svg>
