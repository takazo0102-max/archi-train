<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">足場の墜落防止と作業床</text>
  <!-- 建地 -->
  <line x1="150" y1="60" x2="150" y2="250" stroke="#64748b" stroke-width="6"/>
  <line x1="360" y1="60" x2="360" y2="250" stroke="#64748b" stroke-width="6"/>
  <!-- 作業床 -->
  <rect x="150" y="200" width="210" height="12" fill="#b08d5a" stroke="#8a6d42"/>
  <!-- 手すり 85cm -->
  <line x1="150" y1="120" x2="360" y2="120" stroke="#16a34a" stroke-width="4"/>
  <!-- 中桟 -->
  <line x1="150" y1="160" x2="360" y2="160" stroke="#22c55e" stroke-width="3"/>
  <!-- 寸法：手すり高さ -->
  <g stroke="#16a34a" stroke-width="1.5" fill="#16a34a">
    <line x1="120" y1="120" x2="120" y2="200"/><polygon points="120,120 115,132 125,132"/><polygon points="120,200 115,188 125,188"/>
  </g>
  <text x="113" y="165" text-anchor="end" font-size="11" fill="#15803d" font-weight="700">85cm以上</text>
  <text x="255" y="113" text-anchor="middle" font-size="11" fill="#15803d" font-weight="700">手すり</text>
  <text x="255" y="153" text-anchor="middle" font-size="11" fill="#15803d">中桟</text>
  <!-- 作業床幅 -->
  <g stroke="#dc2626" stroke-width="1.5" fill="#dc2626">
    <line x1="150" y1="228" x2="360" y2="228"/><polygon points="150,228 162,223 162,233"/><polygon points="360,228 348,223 348,233"/>
  </g>
  <text x="255" y="246" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">作業床 幅40cm以上</text>
  <text x="250" y="278" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="700">高さ2m以上：作業床 幅40cm以上・手すり85cm以上＋中桟</text>
</svg>
