<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">熱貫流率 U と熱抵抗</text>
  <!-- 壁断面 -->
  <rect x="60" y="60" width="30" height="150" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="90" y="60" width="50" height="150" fill="#fde68a" stroke="#64748b"/>
  <rect x="140" y="60" width="20" height="150" fill="#e2e8f0" stroke="#64748b"/>
  <text x="75" y="225" text-anchor="middle" font-size="10" fill="#334155">RC</text>
  <text x="115" y="225" text-anchor="middle" font-size="10" fill="#334155">断熱材</text>
  <text x="150" y="225" text-anchor="middle" font-size="10" fill="#334155">仕上</text>
  <text x="30" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">室内</text>
  <text x="190" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">屋外</text>
  <text x="30" y="150" text-anchor="middle" font-size="9" fill="#64748b">αi=9</text>
  <text x="190" y="150" text-anchor="middle" font-size="9" fill="#64748b">αo=23</text>
  <path d="M35 100 L55 100" stroke="#ef4444" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker></defs>
  <!-- 式 -->
  <rect x="215" y="50" width="270" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">R = 1/αi + Σ(d/λ) + 1/αo</text>
  <text x="350" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">U = 1 / R　[W/(m²·K)]</text>
  <text x="350" y="118" text-anchor="middle" font-size="10" fill="#334155">d：厚さ[m]　λ：熱伝導率[W/(m·K)]</text>
  <text x="350" y="132" text-anchor="middle" font-size="10" fill="#334155" textLength="264" lengthAdjust="spacingAndGlyphs">中空層の熱抵抗は約 0.09〜0.18 m²·K/W（厚さで頭打ち）</text>
  <g font-size="11" fill="#334155">
    <rect x="215" y="150" width="270" height="95" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="225" y="170" font-weight="700" fill="#1e293b">熱伝導率 λ の目安 [W/(m·K)]</text>
    <text x="225" y="188" textLength="255" lengthAdjust="spacingAndGlyphs">金属 40〜200 ＞ コンクリート 1.6 ＞ 木材 0.15</text>
    <text x="225" y="204" textLength="255" lengthAdjust="spacingAndGlyphs">＞ グラスウール 0.04 ≒ 静止空気 0.024（湿ると大）</text>
    <text x="225" y="222" textLength="255" lengthAdjust="spacingAndGlyphs">● U が小さい＝断熱性が高い。貫流熱量 = U·A·Δt</text>
    <text x="225" y="238" textLength="255" lengthAdjust="spacingAndGlyphs">● 熱伝達率 α：室内 9、屋外 23（風で大きくなる）</text>
  </g>
  <text x="250" y="266" text-anchor="middle" font-size="10.5" fill="#334155">外断熱＝躯体の蓄熱を室内側に使える・熱橋が少ない／内断熱＝暖冷房の立ち上がりが速い</text>
  <text x="250" y="284" text-anchor="middle" font-size="10" fill="#64748b">窓の U：単板 6.0 ＞ 複層 3.0 ＞ Low-E複層 2.0 ＞ 三層 1.0 程度</text>
</svg>
