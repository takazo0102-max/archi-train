<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">太陽の南中高度（北緯35度付近）</text>
  <!-- 地面 -->
  <rect x="0" y="248" width="500" height="52" fill="#dCE8d2"/>
  <line x1="40" y1="248" x2="460" y2="248" stroke="#9aa6b6" stroke-width="2"/>
  <!-- 観測点・建物 -->
  <rect x="60" y="218" width="26" height="30" fill="#cbd5e1" stroke="#94a3b8"/>
  <!-- 夏至の太陽（高い 約78°） -->
  <line x1="73" y1="248" x2="150" y2="60" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="150" cy="60" r="14" fill="#fbbf24"/>
  <text x="172" y="64" font-size="13" fill="#b45309" font-weight="700">夏至 約78°（高い）</text>
  <!-- 冬至の太陽（低い 約31°） -->
  <line x1="73" y1="248" x2="320" y2="160" stroke="#fb923c" stroke-width="3"/>
  <circle cx="320" cy="160" r="13" fill="#fdba74"/>
  <text x="338" y="164" font-size="13" fill="#9a3412" font-weight="700">冬至 約31.5°（低い）</text>
  <!-- 角度の弧 -->
  <path d="M120,248 A60,60 0 0 1 108,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="250" y="288" text-anchor="middle" font-size="13" fill="#334155">南中高度＝90°−緯度±赤緯（夏至は高く・冬至は低い）　＊南向き断面</text>
</svg>
