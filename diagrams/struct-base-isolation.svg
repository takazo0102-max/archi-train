<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">免震構造と制振構造</text>
  <!-- 免震 -->
  <text x="135" y="56" text-anchor="middle" font-size="14" fill="#15803d" font-weight="700">免震構造</text>
  <rect x="90" y="70" width="90" height="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <!-- 積層ゴム -->
  <g fill="#475569"><rect x="100" y="190" width="20" height="18"/><rect x="150" y="190" width="20" height="18"/></g>
  <g stroke="#94a3b8" stroke-width="1"><line x1="100" y1="195" x2="120" y2="195"/><line x1="100" y1="201" x2="120" y2="201"/><line x1="150" y1="195" x2="170" y2="195"/><line x1="150" y1="201" x2="170" y2="201"/></g>
  <line x1="70" y1="210" x2="200" y2="210" stroke="#64748b" stroke-width="3"/>
  <text x="135" y="228" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="700">免震層（積層ゴム等）</text>
  <text x="135" y="244" text-anchor="middle" font-size="10.5" fill="#15803d">固有周期を長くして地震力を低減</text>
  <text x="135" y="259" text-anchor="middle" font-size="10.5" fill="#475569">地盤と上部構造を絶縁</text>

  <line x1="250" y1="50" x2="250" y2="265" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 制振 -->
  <text x="365" y="56" text-anchor="middle" font-size="14" fill="#b45309" font-weight="700">制振（制震）構造</text>
  <rect x="320" y="70" width="90" height="140" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <!-- ダンパー（ブレース状） -->
  <g stroke="#dc2626" stroke-width="4"><line x1="325" y1="115" x2="405" y2="160"/></g>
  <rect x="355" y="130" width="22" height="14" fill="#7c2d12" transform="rotate(30 366 137)"/>
  <line x1="300" y1="210" x2="430" y2="210" stroke="#64748b" stroke-width="3"/>
  <text x="365" y="228" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="700">ダンパー（構造体内）</text>
  <text x="365" y="244" text-anchor="middle" font-size="10.5" fill="#b45309">振動エネルギーを吸収して揺れを低減</text>
  <text x="365" y="259" text-anchor="middle" font-size="10.5" fill="#475569">オイル・鋼材・粘性 等</text>
</svg>
