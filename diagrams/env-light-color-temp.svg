<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">光色・演色性・照明の省エネ制御</text>
  <g font-size="10" fill="#334155">
    <rect x="20" y="36" width="88" height="34" rx="4" fill="#fbbf24" stroke="#94a3b8"/>
    <text x="64" y="50" text-anchor="middle" font-weight="700" fill="#1e293b">電球色</text>
    <text x="64" y="64" text-anchor="middle">2,700〜3,000K</text>
    <rect x="114" y="36" width="88" height="34" rx="4" fill="#fcd34d" stroke="#94a3b8"/>
    <text x="158" y="50" text-anchor="middle" font-weight="700" fill="#1e293b">温白色</text>
    <text x="158" y="64" text-anchor="middle">3,500K</text>
    <rect x="208" y="36" width="88" height="34" rx="4" fill="#fef3c7" stroke="#94a3b8"/>
    <text x="252" y="50" text-anchor="middle" font-weight="700" fill="#1e293b">白色</text>
    <text x="252" y="64" text-anchor="middle">4,200K</text>
    <rect x="302" y="36" width="88" height="34" rx="4" fill="#e0f2fe" stroke="#94a3b8"/>
    <text x="346" y="50" text-anchor="middle" font-weight="700" fill="#1e293b">昼白色</text>
    <text x="346" y="64" text-anchor="middle">5,000K</text>
    <rect x="396" y="36" width="88" height="34" rx="4" fill="#bae6fd" stroke="#94a3b8"/>
    <text x="440" y="50" text-anchor="middle" font-weight="700" fill="#1e293b">昼光色</text>
    <text x="440" y="64" text-anchor="middle">6,500K</text>
    <text x="20" y="84" fill="#b45309">← 相関色温度 低（赤み・落ち着き）</text>
    <text x="480" y="84" text-anchor="end" fill="#0369a1">高（青白い・活動的）→</text>
  </g>
  <rect x="15" y="94" width="470" height="92" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="94" width="470" height="16" fill="#dbeafe"/>
  <g font-size="10" fill="#334155">
    <text x="22" y="106" font-weight="700" fill="#1e3a8a">演色性・光色の知覚</text>
    <text x="22" y="122">Ra（平均演色評価数）：同じ相関色温度の基準光との比較。最大100・手術室は高Ra</text>
    <text x="22" y="137">演色は光源の分光分布で決まる → 相関色温度が同じでも Ra や光色は異なりうる</text>
    <text x="22" y="152">クルイトフ：低照度では低色温度、高照度では高色温度の光が好まれる</text>
    <text x="22" y="167">短波長（高色温度）の光を午前に浴びる → サーカディアンリズム維持</text>
  </g>
  <rect x="15" y="194" width="470" height="76" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="194" width="470" height="16" fill="#fee2e2"/>
  <g font-size="10" fill="#334155">
    <text x="22" y="206" font-weight="700" fill="#991b1b">グレア・省エネ制御</text>
    <text x="22" y="222">UGR：人工照明のまぶしさ指標（面積の広い窓面のグレアには適用しない）</text>
    <text x="22" y="237">初期照度補正：新設時の過剰照度を抑える ／ 明るさ検知：開口率が大きいほど効果大</text>
    <text x="22" y="252">ブラインド自動制御＋照度センサー ／ 在室検知 ／ LEDは熱放射が少なく長寿命</text>
  </g>
  <text x="15" y="290" font-size="10" fill="#b91c1c" font-weight="700">昼白色は電球色より色温度が「高い」（低いは誤り）</text>
</svg>
