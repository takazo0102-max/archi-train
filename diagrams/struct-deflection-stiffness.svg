<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">梁のたわみと剛性</text>
  <g font-size="10.5" fill="#334155">
    <rect x="20" y="40" width="465" height="110" fill="#fff" stroke="#94a3b8"/>
    <text x="30" y="58" font-weight="700" fill="#1e293b">支持条件・荷重</text><text x="250" y="58" font-weight="700" fill="#1e293b">最大たわみ δ</text><text x="380" y="58" font-weight="700" fill="#1e293b">最大曲げ M</text>
    <line x1="20" y1="64" x2="485" y2="64" stroke="#94a3b8"/>
    <text x="30" y="82">単純梁・等分布荷重 w</text><text x="250" y="82">5wL⁴ / 384EI</text><text x="380" y="82">wL² / 8</text>
    <text x="30" y="100">単純梁・中央集中荷重 P</text><text x="250" y="100">PL³ / 48EI</text><text x="380" y="100">PL / 4</text>
    <text x="30" y="118">両端固定・等分布荷重 w</text><text x="250" y="118">wL⁴ / 384EI（単純梁の 1/5）</text><text x="380" y="118">wL² / 12（端部）</text>
    <text x="30" y="136">片持梁・先端集中荷重 P</text><text x="250" y="136">PL³ / 3EI</text><text x="380" y="136">PL（固定端）</text>
  </g>
  <g font-size="10.5" fill="#334155">
    <rect x="20" y="158" width="465" height="100" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="30" y="176" font-weight="700" fill="#1e293b">たわみを減らすには（δ ∝ L³〜L⁴ / EI）</text>
    <text x="30" y="194">● スパン L を短く（最も効く：L が 2 倍でたわみは 8〜16 倍）</text>
    <text x="30" y="210">● 断面二次モーメント I を大きく（I＝bh³/12：せい h を大きくすると 3 乗で効く）</text>
    <text x="30" y="226">● ヤング係数 E の大きい材料（鋼 2.05×10⁵ ＞ コンクリート 2〜3×10⁴ ＞ 木 約 10⁴）</text>
    <text x="30" y="242">● 支持条件を固定に近づける（両端固定は単純梁の 1/5）　● 変形制限：δ/L ≦ 1/250</text>
    <text x="30" y="254" font-size="10" fill="#64748b">　RC梁は長期のクリープ・ひび割れで 8〜16 倍に増大するのでその倍率を掛けて検討</text>
  </g>
  <text x="250" y="278" text-anchor="middle" font-size="10.5" fill="#334155">剛性＝ EI（曲げ）、GA（せん断）、EA（軸）。柱の水平剛性＝ 12EI/h³（両端固定）</text>
  <text x="250" y="294" text-anchor="middle" font-size="10" fill="#64748b">柱の水平剛性は柱の高さ h の 3 乗に反比例 → 短い柱（腰壁付き短柱）に力が集中する</text>
</svg>
