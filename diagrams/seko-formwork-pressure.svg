<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">型枠に作用する側圧</text>
  <!-- せき板 -->
  <line x1="180" y1="60" x2="180" y2="230" stroke="#64748b" stroke-width="6"/>
  <text x="160" y="55" text-anchor="middle" font-size="11" fill="#475569">せき板</text>
  <!-- 側圧の三角形分布 -->
  <polygon points="186,60 186,230 320,230" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <!-- 圧力矢印 -->
  <g stroke="#2563eb" stroke-width="2" fill="#2563eb">
    <line x1="240" y1="210" x2="190" y2="210"/><polygon points="186,210 198,205 198,215"/>
    <line x1="220" y1="170" x2="190" y2="170"/><polygon points="186,170 198,165 198,175"/>
    <line x1="205" y1="120" x2="190" y2="120"/><polygon points="186,120 198,115 198,125"/>
  </g>
  <text x="335" y="225" font-size="11" fill="#1d4ed8" font-weight="700">下部ほど側圧大</text>
  <text x="250" y="258" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">側圧は、打込み速さが速いほど、コンクリート温度が低いほど大きい</text>
  <text x="250" y="280" text-anchor="middle" font-size="11" fill="#475569">（凝結が遅れ液状の高さが増すため）</text>
</svg>
