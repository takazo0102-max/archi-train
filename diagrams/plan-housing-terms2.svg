<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">住宅・集合住宅の用語と制度</text>
  <rect x="15" y="36" width="470" height="88" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="36" width="470" height="16" fill="#dbeafe"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="48" font-weight="700" fill="#1e3a8a">平面形式・用語</text>
    <text x="22" y="64">四間取（田の字型）：土間を除く床上を4室に田の字構成。襖を外すと一室</text>
    <text x="22" y="80">51C型：食寝分離（食事室と寝室を分ける DK型）×「食事室と台所を分離」</text>
    <text x="22" y="96">デュアルリビング：接客用（フォーマル）と家族用（ファミリー）の2つのリビング</text>
    <text x="22" y="112">リビングアクセス：居間側を共用廊下に面させ交流・見守り（釜石市天神復興住宅）</text>
  </g>
  <rect x="15" y="130" width="470" height="72" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="130" width="470" height="16" fill="#fef3c7"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="142" font-weight="700" fill="#92400e">作品</text>
    <text x="22" y="158">ムードンの住宅（ジャン・プルーヴェ）：アルミニウム等を用いた住宅</text>
    <text x="22" y="174">六番池アパート（水戸）：中央広場は外部からも通り抜けできる開かれた広場</text>
    <text x="22" y="190">陸前高田のみんなの家：津波で立ち枯れたスギ丸太を用いた集会場</text>
  </g>
  <rect x="15" y="208" width="470" height="72" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="208" width="470" height="16" fill="#fee2e2"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="220" font-weight="700" fill="#991b1b">制度</text>
    <text x="22" y="236">防災集団移転促進事業：災害危険区域等からの住居の集団的移転を促進</text>
    <text x="22" y="252">住宅セーフティネット：シェアハウス（共同居住型）も基準を満たせば登録 可</text>
    <text x="22" y="268">長期修繕計画：計画期間30年以上 かつ 大規模修繕工事を 2回 含む（×1回）</text>
  </g>
  <text x="250" y="292" text-anchor="middle" font-size="9.5" fill="#64748b">数字：長期修繕30年・2回、51C＝食寝分離</text>
</svg>
