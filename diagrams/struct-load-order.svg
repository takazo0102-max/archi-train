<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">積載荷重の大小関係</text>
  <text x="250" y="58" text-anchor="middle" font-size="13" fill="#475569">同じ室でも計算対象により値が異なる</text>
  <!-- バー（大きさ比較） -->
  <g>
    <text x="60" y="100" font-size="13" fill="#1e293b" font-weight="700">床用</text>
    <rect x="150" y="86" width="290" height="22" fill="#2563eb"/>
    <text x="60" y="150" font-size="13" fill="#1e293b" font-weight="700">大ばり・柱・基礎用</text>
    <rect x="150" y="136" width="210" height="22" fill="#3b82f6"/>
    <text x="60" y="200" font-size="13" fill="#1e293b" font-weight="700">地震力計算用</text>
    <rect x="150" y="186" width="130" height="22" fill="#93c5fd"/>
  </g>
  <text x="250" y="245" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="700">床用 ≧ 大ばり・柱・基礎用 ≧ 地震力計算用</text>
  <text x="250" y="270" text-anchor="middle" font-size="11.5" fill="#475569">対象範囲が広いほど、同時に満載となる確率が下がるため小さくできる</text>
</svg>
