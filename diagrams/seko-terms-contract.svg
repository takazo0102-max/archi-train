<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">施工の用語と工事請負契約約款</text>
  <rect x="15" y="34" width="470" height="100" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="34" width="470" height="16" fill="#dbeafe"/>
  <g font-size="8.3" fill="#334155">
    <text x="22" y="46" font-weight="700" fill="#1e3a8a">用語</text>
    <text x="22" y="62">セトリング：丸太組構法で丸太の乾燥収縮・自重で壁高さが下がる ／ CLT：ひき板を直交積層（平行積層の単板はLVL）</text>
    <text x="22" y="77">歩掛り：単位工事量あたりの標準労働量・資材量 ／ クリープ：一定荷重の持続でひずみが増大 ／ リフトアップ工法</text>
    <text x="22" y="92">DPG構法：強化ガラスの孔に点支持金物 ／ 複層ガラス：スペーサーで間隔を保ち乾燥気体を封入</text>
    <text x="22" y="107">エントレインドエア：AE剤で連行した微細気泡 ／ ブリーディング：練混ぜ水が上昇 ／ クラックスケール：幅を測る</text>
    <text x="22" y="122">インバート：汚水ますの底の半円形溝 ／ バスダクト：大電流の配電用ダクト ／ ラミネーション：圧延鋼材の層状欠陥</text>
  </g>
  <rect x="15" y="142" width="470" height="56" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="142" width="470" height="16" fill="#fee2e2"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="154" font-weight="700" fill="#991b1b">工事請負契約約款（民間連合協定）</text>
    <text x="22" y="170">受注者は出来形・搬入材料に火災保険等を付し証券の写しを提出</text>
    <text x="22" y="185">工事用図書のとおりでない部分は受注者の費用で修補（工期延長は請求できない）</text>
  </g>
</svg>
