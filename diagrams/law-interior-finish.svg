<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">内装制限：どこに何を使う？（令128条の5）</text>
  <!-- 材料の階層 -->
  <rect x="25" y="50" width="130" height="34" rx="6" fill="#fde68a"/>
  <text x="90" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">難燃材料（5分）</text>
  <rect x="25" y="90" width="130" height="34" rx="6" fill="#fdba74"/>
  <text x="90" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">準不燃材料（10分）</text>
  <rect x="25" y="130" width="130" height="34" rx="6" fill="#f87171"/>
  <text x="90" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#450a0a">不燃材料（20分）</text>
  <text x="90" y="185" text-anchor="middle" font-size="11" fill="#334155">↑ 下ほど厳しい</text>
  <!-- 部位別 -->
  <g font-size="12" fill="#334155">
    <text x="175" y="66" font-weight="700" fill="#1e293b">居室（一般）</text><text x="330" y="66">難燃でよい</text>
    <text x="175" y="88" font-weight="700" fill="#1e293b">3階以上の居室</text><text x="330" y="88">準不燃</text>
    <text x="175" y="110" font-weight="700" fill="#1e293b">通路・廊下・階段</text><text x="330" y="110">準不燃</text>
    <text x="175" y="132" font-weight="700" fill="#1e293b">地階の特殊建築物</text><text x="330" y="132">準不燃</text>
    <text x="175" y="154" font-weight="700" fill="#1e293b">火気使用室・車庫</text><text x="330" y="154">準不燃</text>
    <text x="175" y="176" font-weight="700" fill="#1e293b">非常用EL乗降ロビー</text><text x="330" y="176">不燃（下地も）</text>
    <text x="175" y="198" font-weight="700" fill="#1e293b">特別避難階段の付室</text><text x="330" y="198">不燃（下地も）</text>
  </g>
  <line x1="165" y1="52" x2="165" y2="205" stroke="#94a3b8" stroke-width="1"/>
  <text x="250" y="232" text-anchor="middle" font-size="12" fill="#334155" textLength="494" lengthAdjust="spacingAndGlyphs">対象外：主要構造部が耐火構造の住宅の調理室 ／ 100m²以内に区画した居室 ／ 3階以上1,000m²未満の学校等</text>
  <text x="250" y="254" text-anchor="middle" font-size="12" fill="#334155">壁は床から1.2m以下の部分を除ける（居室のみ）。SP＋排煙があれば適用除外</text>
  <text x="250" y="280" text-anchor="middle" font-size="11" fill="#64748b">難燃＜準不燃＜不燃：上位は下位を兼ねる</text>
</svg>
