<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">第一種低層住居専用地域</text>

  <!-- 建てられる -->
  <rect x="30" y="55" width="210" height="210" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="82" text-anchor="middle" font-size="16" fill="#15803d" font-weight="700">建てられる ◯</text>
  <g font-size="14" fill="#166534">
    <text x="55" y="118">・住宅・共同住宅</text>
    <text x="55" y="148">・小学校・中学校・高校</text>
    <text x="55" y="178">・図書館</text>
    <text x="55" y="208">・診療所・保育所</text>
    <text x="55" y="238">・神社・寺院</text>
  </g>

  <!-- 建てられない -->
  <rect x="260" y="55" width="210" height="210" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="365" y="82" text-anchor="middle" font-size="16" fill="#b91c1c" font-weight="700">建てられない ✕</text>
  <g font-size="14" fill="#991b1b">
    <text x="285" y="118">・大学・専修学校</text>
    <text x="285" y="148">・病院</text>
    <text x="285" y="178">・ホテル・旅館</text>
    <text x="285" y="208">・大規模な店舗</text>
    <text x="285" y="238">・事務所</text>
  </g>
</svg>
