<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">容積率＝延べ面積／敷地面積（法52条）</text>
  <!-- 建物 -->
  <rect x="40" y="70" width="120" height="150" fill="#fff" stroke="#475569" stroke-width="2"/>
  <line x1="40" y1="120" x2="160" y2="120" stroke="#94a3b8"/><line x1="40" y1="170" x2="160" y2="170" stroke="#94a3b8"/>
  <rect x="40" y="220" width="120" height="30" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#334155">地階（住宅）</text>
  <rect x="120" y="70" width="40" height="150" fill="#dbeafe" stroke="#475569"/>
  <text x="140" y="150" text-anchor="middle" font-size="10" fill="#1e3a8a" transform="rotate(90 140 150)">共用廊下・階段・EL</text>
  <rect x="170" y="200" width="20" height="50" fill="#dcfce7" stroke="#475569"/>
  <text x="180" y="190" text-anchor="middle" font-size="10" fill="#166534">車庫</text>
  <!-- 前面道路 -->
  <rect x="20" y="256" width="200" height="14" fill="#94a3b8"/>
  <text x="120" y="282" text-anchor="middle" font-size="10" fill="#334155">前面道路 幅員W（12m未満なら</text>
  <text x="120" y="294" text-anchor="middle" font-size="10" fill="#334155">W×0.4／0.6 とも比較し小さいほう）</text>
  <g font-size="12" fill="#334155">
    <text x="230" y="70" font-weight="700" fill="#1e293b">延べ面積に算入しない</text>
    <text x="230" y="90" textLength="265" lengthAdjust="spacingAndGlyphs">・住宅・老人ホーム等の地階：その部分の <tspan font-weight="700" fill="#b91c1c">1/3</tspan> まで</text>
    <text x="230" y="108">・自動車車庫：全体の <tspan font-weight="700" fill="#b91c1c">1/5</tspan> まで</text>
    <text x="230" y="126">・共同住宅・老人ホームの共用廊下・階段：<tspan font-weight="700" fill="#b91c1c">全部</tspan></text>
    <text x="230" y="144">・EL昇降路：<tspan font-weight="700" fill="#b91c1c">全部</tspan></text>
    <text x="230" y="162" textLength="265" lengthAdjust="spacingAndGlyphs">・備蓄倉庫 1/50、蓄電池 1/50、自家発電 1/100</text>
    <text x="230" y="180">・貯水槽 1/100、宅配ボックス 1/100</text>
    <text x="230" y="206" font-weight="700" fill="#1e293b">道路幅員による限度（用途地域）</text>
    <text x="230" y="224">住居系：W×<tspan font-weight="700">4/10</tspan>　その他：W×<tspan font-weight="700">6/10</tspan></text>
    <text x="230" y="242">特定道路（15m以上）から70m以内は加算あり</text>
  </g>
</svg>
