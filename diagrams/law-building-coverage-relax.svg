<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">建蔽率の制限の緩和（適用除外）</text>

  <!-- 条件 -->
  <g font-size="15" fill="#334155">
    <text x="40" y="78" font-weight="700">条件（すべて満たす）</text>
    <text x="55" y="106">① 建蔽率の限度が 10分の8 の地域</text>
    <text x="55" y="134">② 防火地域内</text>
    <text x="55" y="162">③ 耐火建築物</text>
  </g>

  <!-- 矢印 -->
  <g stroke="#16a34a" stroke-width="3" fill="#16a34a">
    <line x1="250" y1="178" x2="250" y2="202"/>
    <polygon points="250,210 243,198 257,198"/>
  </g>

  <!-- 敷地いっぱいに建つ -->
  <g>
    <rect x="150" y="222" width="200" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="150" y="222" width="200" height="58" fill="#4ade80" opacity="0.55"/>
    <text x="250" y="248" text-anchor="middle" font-size="14" fill="#14532d" font-weight="700">敷地 ＝ 建築物</text>
    <text x="250" y="268" text-anchor="middle" font-size="14" fill="#15803d" font-weight="700" textLength="194" lengthAdjust="spacingAndGlyphs">建蔽率の制限なし（適用除外）</text>
  </g>
</svg>
