<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">高力ボルト摩擦接合のしくみ</text>
  <!-- 断面 -->
  <rect x="40" y="90" width="180" height="16" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="40" y="106" width="180" height="16" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="120" y="60" width="20" height="90" fill="#334155"/>
  <rect x="108" y="60" width="44" height="12" fill="#1e293b"/>
  <rect x="108" y="138" width="44" height="12" fill="#1e293b"/>
  <line x1="130" y1="72" x2="130" y2="90" stroke="#ef4444" stroke-width="3"/>
  <line x1="130" y1="122" x2="130" y2="138" stroke="#ef4444" stroke-width="3"/>
  <text x="160" y="80" font-size="11" font-weight="700" fill="#b91c1c">締付け（軸力 N）</text>
  <line x1="40" y1="98" x2="20" y2="98" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="220" y1="114" x2="240" y2="114" stroke="#0ea5e9" stroke-width="3"/>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#334155">板と板の間の <tspan font-weight="700">摩擦</tspan> で力を伝える</text>
  <text x="130" y="192" text-anchor="middle" font-size="11" fill="#334155">許容せん断力 ＝ μ × N × 面数 ／ 安全率</text>
  <text x="130" y="209" text-anchor="middle" font-size="11" fill="#334155">（すべり係数 μ ＝ <tspan font-weight="700">0.45</tspan>、2面摩擦は2倍）</text>
  <!-- 右：ポイント -->
  <g font-size="11" fill="#334155">
    <rect x="270" y="45" width="215" height="200" fill="#fff" stroke="#94a3b8"/>
    <text x="377" y="64" text-anchor="middle" font-weight="700" fill="#1e293b">ポイント</text>
    <text x="280" y="84">● 摩擦面：黒皮除去・赤錆</text>
    <text x="280" y="100">　（ブラスト処理で μ 0.45 確保）</text>
    <text x="280" y="120">● 孔径：ボルト径＋2mm</text>
    <text x="280" y="136">　（径27mm以上は＋3mm）</text>
    <text x="280" y="156">● 締付け：一次締め → マーキング</text>
    <text x="280" y="172">　→ 本締め（トルシア形はピンテール）</text>
    <text x="280" y="192">● 摩擦面に塗装・めっき・肌すきは不可</text>
    <text x="280" y="208">　（肌すき1mm超はフィラープレート）</text>
    <text x="280" y="228">● 溶接と併用：溶接前に締めれば分担可</text>
  </g>
  <text x="250" y="266" text-anchor="middle" font-size="11" fill="#334155">引張接合（ボルト軸方向）では、外力が締付け力を超えるまで板は離れない</text>
  <text x="250" y="284" text-anchor="middle" font-size="10" fill="#64748b">支圧接合（普通ボルト）は軸部のせん断・孔壁の支圧で伝達 → 高力ボルトとは別扱い</text>
</svg>
