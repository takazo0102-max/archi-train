<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">日射熱取得率・遮蔽係数・Low-Eガラス</text>
  <rect x="15" y="36" width="470" height="52" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="36" width="470" height="16" fill="#dbeafe"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="48" font-weight="700" fill="#1e3a8a">日射熱取得率（日射侵入率）</text>
    <text x="22" y="64">＝（透過した日射 ＋ ガラスが吸収後に室内側へ放出する熱）÷ 入射日射 ×透過分のみは誤り</text>
    <text x="22" y="80">ブラインドを 内側 に設けると吸収熱が室内へ放出されるので 外側より取得率が大きい</text>
  </g>
  <rect x="15" y="94" width="470" height="36" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="94" width="470" height="16" fill="#fef3c7"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="106" font-weight="700" fill="#92400e">日射遮蔽係数（SC）</text>
    <text x="22" y="122">3mm透明ガラスを1とした比。値が 小さい ほど遮蔽効果が大きい（×大きいほど大きい）</text>
  </g>
  <rect x="15" y="136" width="470" height="52" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="136" width="470" height="16" fill="#fee2e2"/>
  <g font-size="10.5" fill="#334155">
    <text x="22" y="148" font-weight="700" fill="#991b1b">Low-Eガラス・熱容量</text>
    <text x="22" y="164">Low-E膜を 屋外側 → 遮熱型（日射遮蔽）／室内側 → 断熱型（暖房熱を逃さない）</text>
    <text x="22" y="180">熱容量の大きい層が室内側にある壁：暖房開始から設定温度到達まで 時間を要する（蓄熱）</text>
  </g>
  <text x="250" y="292" text-anchor="middle" font-size="9.5" fill="#64748b">取得率＝透過＋吸収放出／SCは小さいほど遮蔽</text>
</svg>
