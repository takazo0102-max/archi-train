<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">車椅子使用者のための寸法</text>
  <circle cx="80" cy="110" r="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="62" y="88" width="36" height="50" rx="4" fill="#fff" stroke="#1e293b" stroke-width="2"/>
  <circle cx="62" cy="124" r="11" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="98" cy="124" r="11" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="80" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">回転：直径 150cm</text>
  <text x="80" y="192" text-anchor="middle" font-size="9" fill="#334155">幅 約70cm・長さ 約120cm</text>
  <g font-size="10" fill="#334155">
    <rect x="160" y="42" width="325" height="215" fill="#fff" stroke="#94a3b8"/>
    <text x="170" y="60" font-weight="700" fill="#1e293b">場所</text><text x="475" y="60" text-anchor="end" font-weight="700" fill="#1e293b">目安</text>
    <line x1="160" y1="66" x2="485" y2="66" stroke="#94a3b8"/>
    <text x="170" y="82">出入口の有効幅</text><text x="475" y="82" text-anchor="end">80cm以上（85〜90 が望ましい）</text>
    <text x="170" y="98">廊下の幅</text><text x="475" y="98" text-anchor="end">すれ違い 180cm／片側 120〜140cm</text>
    <text x="170" y="114">傾斜路の勾配</text><text x="475" y="114" text-anchor="end">屋内 1/12以下（屋外 1/15）</text>
    <text x="170" y="130">傾斜路の踊場</text><text x="475" y="130" text-anchor="end">高さ 75cm ごと・幅 120cm以上</text>
    <text x="170" y="146">手すりの高さ</text><text x="475" y="146" text-anchor="end">75〜85cm（2段は 65 と 85）</text>
    <text x="170" y="162">カウンター・洗面</text><text x="475" y="162" text-anchor="end">高さ 70〜75cm、膝入れ 60cm以上</text>
    <text x="170" y="178">駐車スペース</text><text x="475" y="178" text-anchor="end">幅 350cm以上（乗降 140cm）</text>
    <text x="170" y="194">エレベーターかご</text><text x="475" y="194" text-anchor="end">奥行 135 × 幅 140cm 以上</text>
    <text x="170" y="210">便所ブース</text><text x="475" y="210" text-anchor="end">200 × 200cm 程度</text>
    <text x="170" y="226">床の段差</text><text x="475" y="226" text-anchor="end">2cm以下は許容</text>
    <text x="170" y="242">机の下・膝入れ高さ</text><text x="475" y="242" text-anchor="end">65〜70cm</text>
  </g>
  <text x="250" y="274" text-anchor="middle" font-size="10.5" fill="#334155">点状ブロック＝警告・注意、線状ブロック＝誘導。段鼻は識別しやすい色に</text>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#64748b">特別特定建築物 2,000m²以上は基準適合義務（バリアフリー法）</text>
</svg>
