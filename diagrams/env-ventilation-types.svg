<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">機械換気の種類</text>

  <!-- 第1種 -->
  <rect x="30" y="70" width="130" height="90" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="62" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">第1種</text>
  <circle cx="45" cy="95" r="9" fill="#3b82f6"/><text x="60" y="99" font-size="10" fill="#1e40af">給気 機械</text>
  <circle cx="45" cy="135" r="9" fill="#ef4444"/><text x="60" y="139" font-size="10" fill="#b91c1c">排気 機械</text>
  <text x="95" y="178" text-anchor="middle" font-size="11" fill="#475569">圧力 自由</text>

  <!-- 第2種 -->
  <rect x="185" y="70" width="130" height="90" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="62" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">第2種</text>
  <circle cx="200" cy="95" r="9" fill="#3b82f6"/><text x="215" y="99" font-size="10" fill="#1e40af">給気 機械</text>
  <text x="200" y="139" font-size="10" fill="#475569">排気 自然</text>
  <text x="250" y="178" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">正圧（＋）クリーンルーム</text>

  <!-- 第3種 -->
  <rect x="340" y="70" width="130" height="90" fill="#fef2f2" stroke="#94a3b8" stroke-width="2"/>
  <text x="405" y="62" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">第3種</text>
  <text x="355" y="99" font-size="10" fill="#475569">給気 自然</text>
  <circle cx="355" cy="135" r="9" fill="#ef4444"/><text x="370" y="139" font-size="10" fill="#b91c1c">排気 機械</text>
  <text x="405" y="178" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">負圧（−）便所・厨房</text>

  <text x="250" y="218" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">給排気とも機械＝第1種 ／ 給気のみ機械＝第2種 ／ 排気のみ機械＝第3種</text>
  <text x="250" y="244" text-anchor="middle" font-size="11" fill="#475569">●＝機械（ファン）　第2種は室内が正圧、第3種は負圧になる</text>
</svg>
