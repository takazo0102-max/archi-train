<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">高さ・階数・面積の算定（令2条）</text>
  <rect x="15" y="34" width="470" height="100" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="34" width="470" height="16" fill="#dbeafe"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="46" font-weight="700" fill="#1e3a8a">高さの算定と緩和</text>
    <text x="22" y="62">屋上の階段室・昇降機塔・装飾塔等：建築面積の1/8以内なら 12m（絶対高さ・日影は5m）まで不算入</text>
    <text x="22" y="77">ただし 北側高さ制限 と 避雷設備（法33条）の高さ判定には適用されない（算入する）</text>
    <text x="22" y="92">道路高さ制限の後退距離特例：ポーチ（高さ5m以下）・軒等は「前面道路の路面の中心」からの高さ</text>
    <text x="22" y="107">隣地高さ制限の緩和：高低差が1m超なら（高低差−1）×1/2 だけ高い位置に地盤面があるとみなす</text>
    <text x="22" y="122">北側高さ制限の緩和対象は水面・線路敷など（公園・広場は対象外）</text>
  </g>
  <rect x="15" y="142" width="470" height="86" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="142" width="470" height="16" fill="#fee2e2"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="154" font-weight="700" fill="#991b1b">階数・面積</text>
    <text x="22" y="170">地階の倉庫・機械室（それらに通ずる階段室を含む）で建築面積の1/8以下 → 階数に算入しない</text>
    <text x="22" y="185">防災センター・休憩室・倉庫（屋上）などは用途上の階 → 1/8以内でも算入する</text>
    <text x="22" y="200">屋上塔屋で階数不算入なのは昇降機塔・装飾塔・物見塔等の用途に限る ／ 階数が異なる部分は最大値</text>
    <text x="22" y="215">階段室は延べ面積には算入する（高さ・階数の不算入とは別）／ 高開放性建築物は端から1mを建築面積不算入</text>
  </g>
  <rect x="15" y="236" width="470" height="40" fill="#fff" stroke="#94a3b8"/>
  <rect x="15" y="236" width="470" height="16" fill="#fef3c7"/>
  <g font-size="9.0" fill="#334155">
    <text x="22" y="248" font-weight="700" fill="#92400e">その他</text>
    <text x="22" y="264">病院の談話室は居室 ／ 高さ60m超は大臣認定（適合性判定の対象外）／ 国・都道府県が建築主は計画通知</text>
  </g>
  <text x="15" y="292" font-size="10" fill="#b91c1c" font-weight="700">ひっかけ：北側高さ制限・避雷設備には1/8緩和なし／防災センターは階数に算入／1/8「以下」で不算入</text>
</svg>
