<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">可視光線の波長</text>
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="20%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#16a34a"/><stop offset="60%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#f97316"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- 紫外線 -->
  <rect x="40" y="120" width="60" height="60" fill="#cbd5e1"/>
  <text x="70" y="155" text-anchor="middle" font-size="11" fill="#475569">紫外線</text>
  <!-- 可視光 -->
  <rect x="100" y="120" width="300" height="60" fill="url(#spec)"/>
  <!-- 赤外線 -->
  <rect x="400" y="120" width="60" height="60" fill="#fca5a5"/>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#7f1d1d">赤外線</text>

  <text x="100" y="205" text-anchor="middle" font-size="13" fill="#6d28d9" font-weight="700">380nm</text>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#6d28d9">紫</text>
  <text x="400" y="205" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">780nm</text>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#b91c1c">赤</text>
  <text x="250" y="110" text-anchor="middle" font-size="12" fill="#334155">可視光線：約 380〜780nm</text>
  <text x="250" y="262" text-anchor="middle" font-size="12" fill="#475569">短波長側が紫、長波長側が赤。範囲外は紫外線・赤外線で見えない</text>
</svg>
