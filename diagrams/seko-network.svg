<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#f1f5f9"/>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">ネットワーク工程表とクリティカルパス</text>
  <!-- nodes -->
  <g>
    <circle cx="60" cy="150" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="60" y="155" text-anchor="middle" font-size="13" font-weight="700">①</text>
    <circle cx="190" cy="90" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="190" y="95" text-anchor="middle" font-size="13" font-weight="700">②</text>
    <circle cx="190" cy="210" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="190" y="215" text-anchor="middle" font-size="13" font-weight="700">③</text>
    <circle cx="330" cy="150" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="330" y="155" text-anchor="middle" font-size="13" font-weight="700">④</text>
    <circle cx="450" cy="150" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="450" y="155" text-anchor="middle" font-size="13" font-weight="700">⑤</text>
  </g>
  <!-- arrows: critical path red (1-3-4-5), others gray -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <line x1="78" y1="158" x2="172" y2="200" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="208" y1="200" x2="312" y2="160" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="350" y1="150" x2="430" y2="150" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="78" y1="142" x2="172" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="208" y1="100" x2="312" y2="142" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
  <text x="120" y="120" font-size="11" fill="#64748b">5日</text>
  <text x="120" y="195" font-size="11" fill="#b91c1c">8日</text>
  <text x="265" y="120" font-size="11" fill="#64748b">4日</text>
  <text x="245" y="195" font-size="11" fill="#b91c1c">7日</text>
  <text x="385" y="142" font-size="11" fill="#b91c1c">6日</text>
  <rect x="60" y="248" width="16" height="10" fill="#dc2626"/>
  <text x="84" y="258" font-size="13" fill="#b91c1c" font-weight="700">クリティカルパス＝所要日数が最長の経路（工期を支配）</text>
</svg>
