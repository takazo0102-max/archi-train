<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">事務所ビルのコア形式とレンタブル比</text>
  <g font-size="9" fill="#334155">
    <rect x="20" y="42" width="100" height="70" fill="#dbeafe" stroke="#94a3b8"/><rect x="55" y="62" width="30" height="30" fill="#fecaca"/>
    <text x="70" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">センターコア</text>
    <text x="70" y="139" text-anchor="middle">高層向き・レンタブル比◎</text>
    <text x="70" y="150" text-anchor="middle">2方向避難に注意</text>
    <rect x="140" y="42" width="100" height="70" fill="#dbeafe" stroke="#94a3b8"/><rect x="140" y="42" width="28" height="70" fill="#fecaca"/>
    <text x="190" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">偏心コア</text>
    <text x="190" y="139" text-anchor="middle">中小規模・執務室が広い</text>
    <text x="190" y="150" text-anchor="middle">構造の偏心に注意</text>
    <rect x="260" y="42" width="100" height="70" fill="#dbeafe" stroke="#94a3b8"/><rect x="260" y="42" width="22" height="70" fill="#fecaca"/><rect x="338" y="42" width="22" height="70" fill="#fecaca"/>
    <text x="310" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">分離（ダブル）コア</text>
    <text x="310" y="139" text-anchor="middle">2方向避難◎・大規模向き</text>
    <text x="310" y="150" text-anchor="middle">基準階の自由度</text>
    <rect x="380" y="42" width="100" height="70" fill="#dbeafe" stroke="#94a3b8"/><rect x="380" y="42" width="28" height="28" fill="#fecaca"/>
    <text x="430" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">外コア（片コア）</text>
    <text x="430" y="139" text-anchor="middle">執務室に柱なし・自由</text>
    <text x="430" y="150" text-anchor="middle">耐震要素が偏る</text>
  </g>
  <g font-size="10.5" fill="#334155">
    <rect x="20" y="162" width="460" height="108" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="30" y="180" font-weight="700" fill="#1e293b">覚える数字</text>
    <text x="30" y="198">● レンタブル比：基準階 <tspan font-weight="700">75〜85%</tspan>、延べ面積ベース <tspan font-weight="700">65〜75%</tspan></text>
    <text x="30" y="216">● 1人あたり執務面積：<tspan font-weight="700">8〜12m²</tspan>（延べ面積では 15〜20m²）</text>
    <text x="30" y="234">● 基準階の階高 3.6〜4.0m、天井高 2.6〜2.8m、フリーアクセスフロア 10〜15cm</text>
    <text x="30" y="252">● モデュール：3.2m／3.6m 系が多い（机・机間の寸法から）</text>
    <text x="30" y="266" font-size="10" fill="#64748b">● エレベーター：1台あたり 2,000〜3,000m²、平均運転間隔 30〜40秒</text>
  </g>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#64748b">オフィスレイアウト：対向式（省面積）／並行式／スタッグ式／フリーアドレス</text>
</svg>
