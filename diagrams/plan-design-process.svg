<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="system-ui, sans-serif">
  <rect width="500" height="300" fill="#eaf2fb"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">設計・監理業務の流れと契約（告示98号）</text>
  <g font-size="9.5" fill="#334155" text-anchor="middle">
    <rect x="15" y="42" width="70" height="42" rx="6" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="50" y="60" font-weight="700">企画</text><text x="50" y="74">与条件整理</text>
    <rect x="95" y="42" width="70" height="42" rx="6" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="130" y="60" font-weight="700">基本設計</text><text x="130" y="74">平面・概算</text>
    <rect x="175" y="42" width="70" height="42" rx="6" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="210" y="60" font-weight="700">実施設計</text><text x="210" y="74">詳細図・仕様</text>
    <rect x="255" y="42" width="70" height="42" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="290" y="60" font-weight="700">確認申請</text><text x="290" y="74">建築主の代理</text>
    <rect x="335" y="42" width="70" height="42" rx="6" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="370" y="60" font-weight="700">工事監理</text><text x="370" y="74">図書と照合</text>
    <rect x="415" y="42" width="70" height="42" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="450" y="60" font-weight="700">竣工</text><text x="450" y="74">監理報告書</text>
    <g stroke="#64748b" stroke-width="2"><line x1="85" y1="63" x2="95" y2="63"/><line x1="165" y1="63" x2="175" y2="63"/><line x1="245" y1="63" x2="255" y2="63"/><line x1="325" y1="63" x2="335" y2="63"/><line x1="405" y1="63" x2="415" y2="63"/></g>
  </g>
  <g font-size="10.5" fill="#334155">
    <rect x="15" y="94" width="470" height="120" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="25" y="112" font-weight="700" fill="#1e293b">四会連合協定「設計・監理等業務委託契約約款」の要点</text>
    <text x="25" y="130">● 契約前に重要事項説明（士法24条の7）。書面に業務内容・報酬・期間・再委託</text>
    <text x="25" y="148">● 成果物の著作権は受託者（設計者）。委託者は写真・模型等で利用できる</text>
    <text x="25" y="166">● 委託者は書面通知で業務を中止できる（受託者は増加費用を請求可）</text>
    <text x="25" y="184">● 一括再委託は禁止。一部再委託は委託者の承諾、責任は受託者が負う</text>
    <text x="25" y="202">● 監理者が原設計者と異なる場合、設計変更は原設計者に別途委託が原則</text>
  </g>
  <g font-size="10.5" fill="#334155">
    <rect x="15" y="222" width="470" height="52" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="25" y="240" font-weight="700" fill="#1e293b">告示98号の業務区分</text>
    <text x="25" y="258">標準業務（設計・工事監理）＋その他の標準業務（工程表・施工計画の検討、支払審査）</text>
    <text x="25" y="270" font-size="10" fill="#64748b">報酬＝業務量×人件費単価＋経費＋技術料等経費。略算は床面積×標準業務量</text>
  </g>
  <text x="250" y="292" text-anchor="middle" font-size="10" fill="#64748b">工事監理の確認は目視・抽出・施工者の品質記録の確認など「合理的方法」でよい</text>
</svg>
